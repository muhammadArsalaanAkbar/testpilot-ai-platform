# Ties deployments.yaml/service-ingress.yaml/config.yaml into one
# applyable base (`kubectl apply -k infra/k8s/base/` or
# `kubectl kustomize infra/k8s/base/`) — the infra/k8s/base + overlays
# directory shape (scaffolded ahead of this phase) is Kustomize's own
# convention; an environment-specific overlay (Future — not built in this
# phase) would reference this base and use the `images:` transformer to
# remap deployments.yaml's placeholder image names to a real registry/tag.

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployments.yaml
  - service-ingress.yaml
  - config.yaml
